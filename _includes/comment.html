<!-- 替换原有 unpkg 脚本为 jsDelivr 国内稳定源 -->
<script src="https://cdn.jsdelivr.net/npm/@waline/client@v3/dist/waline.umd.js"></script>

<script>
function initWaline() {
  // 调试日志，排查正常后可删除
  console.log('检查 Waline 脚本：', !!window.Waline);
  
  if (!window.Waline) {
    setTimeout(initWaline, 300);
    return;
  }

  Waline.init({
    el: '#waline',
    serverURL: 'https://waline.cc.cd', // 保留你原有的服务端地址
    lang: 'zh-CN',
    // 修正为数组格式：[最小字数, 最大字数]
    wordLimit: [0, 500],
    // 修正隐藏版权的正确参数名
    noCopyright: true,
    // 以下保留通用默认配置，你可按需增减原有参数
    avatar: 'mp',
    pageview: true,
    requiredFields: ['nick'],
  });
  
  console.log('初始化执行完成');
}

// 兼容页面加载状态
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initWaline);
} else {
  initWaline();
}
</script>
