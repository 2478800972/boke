<section class="mt-5 pt-4 border-top">
  <h4 class="mb-4 fw-medium">{{ site.data.locales[lang].comment.comments }}</h4>
  <div id="waline"></div>
</section>

<link rel="stylesheet" href="https://unpkg.com/@waline/client@v3/dist/waline.css" />

<style>
  /* ... 你的所有自定义样式保持不变 ... */
</style>

<!-- 关键改动：使用 UMD 格式，而非 type="module" -->
<script src="https://unpkg.com/@waline/client@v3/dist/waline.umd.js"></script>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    var container = document.querySelector('#waline');
    if (!container) {
      console.warn('未找到 #waline 容器');
      return;
    }

    try {
      Waline.init({
        el: '#waline',
        serverURL: 'https://waline.cc.cd',
        path: window.location.pathname,
        dark: 'html[data-mode="dark"]',
        lang: 'zh-CN',
        meta: ['nick', 'mail', 'link'],
        requiredMeta: [],
        login: 'disable',
        wordLimit: 500,
        pageSize: 10,
        copyright: false,
        commentSorting: 'latest',
        search: false,
        locale: {
          placeholder: '你可以在这里输入评论内容... 但不要乱输入',
          submit: '来一发吗？',
          optional: '可选',
          nick: '昵称',
          mail: '邮箱',
          link: '网址'
        }
      });
      console.log('✅ Waline 初始化成功');
    } catch (err) {
      console.error('❌ Waline 初始化失败：', err);
    }
  });
</script>
